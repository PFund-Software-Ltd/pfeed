default_install_hook_types:
- pre-commit
- prepare-commit-msg
- commit-msg
- pre-push
exclude: ^afterpython/_website/
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    stages:
    - pre-commit
  - id: end-of-file-fixer
    stages:
    - pre-commit
  - id: check-yaml
    stages:
    - pre-commit
  - id: check-toml
    stages:
    - pre-commit
  - id: check-added-large-files
    stages:
    - pre-commit
- repo: local
  hooks:
  # same id twice so that SKIP=ap-commit skips both
  # git GUIs run hooks with a minimal PATH (no uv/venv), so put the project venv on PATH ourselves
  - id: ap-commit
    name: commit message template
    entry: sh -c 'PATH="$PWD/.venv/bin:$PWD/.venv/Scripts:$PATH" exec ap commit-msg --template "$@"' --
    language: system
    stages:
    - prepare-commit-msg
  - id: ap-commit
    name: check commit message
    entry: sh -c 'PATH="$PWD/.venv/bin:$PWD/.venv/Scripts:$PATH" exec ap commit-msg "$@"' --
    language: system
    stages:
    - commit-msg
