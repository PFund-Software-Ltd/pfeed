[workspace]
authors = ["softwareentrepreneer <softwareentrepreneer+pfeed@gmail.com>"]
channels = ["conda-forge"]
name = "pfeed"
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "win-64"]
# NOTE: should match with setup-pixi in ci.yml
requires-pixi = ">=0.83.0"
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0d"

[pypi-exclude-newer]
afterpython = "0d"
uv_build = "0d"
pfund-blocks = "0d"
pfund-kit = "0d"

[tasks]

[tasks.test-all]
depends-on = [
  { task = "test", environment = "py313" },
  { task = "test", environment = "py314" },
  { task = "test", environment = "py315" },
  # TODO: add test-all to test all plugins, including e.g. pfeed-bybit
]

[dependencies]
just = ">=1.59.0"

# [pypi-options]
# prerelease-mode = "allow"

[pypi-dependencies]
pfund-blocks = ">=0.0.1"
pfund-kit = ">=0.1.22"
pyarrow = ">=26.0.0"
polars = ">=2.0.0"
duckdb = ">=2.0.0"
pandera = ">=0.34.1"
msgspec = ">=0.22.0"
pydantic = ">=2.14.1"
narwhals = ">=2.27.1"
beautifulsoup4 = ">=4.15.0"
pyzmq = ">=27.2.0"

[environments]
default = ["py313", "dev", "test", "optional"]
py313 = ["py313", "test", "optional"]
py314 = ["py314", "test", "optional"]
py315 = ["py315", "test", "optional"]

[activation.env]
# JAVA_HOME = "$CONDA_PREFIX/lib/jvm"
# JDK_HOME  = "$JAVA_HOME"
# PATH      = "$JAVA_HOME/bin:$PATH"

[feature.optional.dependencies]
# openjdk = "21.*"  # for spark
libpq = ">=18.4"  # for postgresql

[feature.optional.pypi-dependencies]
# TODO: remove the env-markers when ray supports python 3.15
ray = { version = ">=2.59.0", extras = ["default"], env-markers = "python_full_version < '3.15'" }
huggingface-hub = ">=2.2.0"
prefect = ">=3.8.8"
lancedb = ">=0.40.0"
# Data Sources:
# NOTE: data sources are plugins, each one is a separate package named `pfeed-xxx`.
# An extra exists here only for an OFFICIALLY SUPPORTED data source, and it pins a verified version:
#   pip install "pfeed[bybit]"  # official, installs `pfeed-bybit`
#   pip install pfeed-xxx       # 3rd party, not maintained or verified by pfeed
# pfeed-bybit = ">=0.0.1.dev1"
# pfeed-pfund = ">=0.0.1.dev1"
# IOs
# psycopg = { version = ">=3.3.3", extras = ["binary", "pool"] }

[feature.dev.pypi-dependencies]
pfeed = { path = ".", editable = true }
pfeed-bybit = { path = "sources/pfeed-bybit", editable = true }  # TEMP
pfeed-pfund = { path = "sources/pfeed-pfund", editable = true }  # TEMP
pfund-plot = { version = ">=0.0.5", extras = ["marimo"] }
# TEMP
pfund = { path = "../pfund", editable = true }
pfund-kit = { path = "../pfund-kit", editable = true }
afterpython = { path ="../../afterpython.org/afterpython", editable = true }  # TEMP
# afterpython = ">=0.4.1"
# used for testing only (for now) to maintain a unified interface for ducklake, deltalake, and iceberg
deltalake = ">=1.6.6"
pyiceberg = { version = ">=0.12.0", extras = ["sql-sqlite", "pyiceberg-core"] }
# dask = { version = ">=2026.6.0", extras = ["complete", "dataframe"] }
# pyspark = { version = ">=4.1.2", extras = ["connect", "pandas-on-spark", "sql"] }
# daft = ">=0.7.15"
# narwhals-daft = ">=0.4.1"

[feature.test.pypi-dependencies]
pfeed = { path = ".", editable = true }
pytest = ">=9.1.1"
pytest-mock = ">=3.16.0"
pytest-xdist = ">=3.8.0"
pytest-asyncio = ">=1.4.0"
# pytest-cov = ">=7.1.0"
# pytest-markdown-docs = ">=0.9.2"
# testcontainers = ">=4.14.2"
[feature.test.tasks]
test = "pytest -n auto"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315.dependencies]
python = "3.15.*"
