[project]
name = "pfeed"
version = "0.0.20"
description = "Data pipeline for algo-trading, getting and storing both real-time and historical data made easy."
license = "Apache-2.0"
authors = [
    {name = "Stephen Yau", email = "softwareentrepreneer+pfeed@gmail.com"}
]
readme = "README.md"
keywords = ["trading", "algo-trading", "data pipeline", "ETL", "data lake", "data warehouse", "data integration", "historical data", "live data", "data streaming", "data engineering"]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.12"
dependencies = [
    "pfund==0.0.25",  # use >= only when pfund is stable
    # NOTE: for some important packages (e.g. polars, pydantic) that can benefit pfeed from using the latest version
    # even Pyodide supports them, still add sys_platform != 'emscripten', meaning that
    # let pfeed WASM use the default versions on Pyodide with NO compatibility guarantee.
    "pyarrow>=25.0.1 ; sys_platform != 'emscripten'",
    "polars>=2.0.0rc2 ; sys_platform != 'emscripten'",
    "duckdb>=2.0.0.dev2609250715 ; sys_platform != 'emscripten'",
    "pandera>=0.33.1",
    "msgspec>=0.22.0 ; sys_platform != 'emscripten'",
    "pydantic>=2.13.5 ; sys_platform != 'emscripten'",
    "narwhals>=2.26.0 ; sys_platform != 'emscripten'",
    "zstandard>=0.25.0",
    "cloudpathlib>=0.25.0",
    "beautifulsoup4>=4.15.0",
    "ray[default]>=2.58.0 ; sys_platform != 'emscripten'",
    "pyzmq>=27.2.0 ; sys_platform != 'emscripten'",
]

[project.optional-dependencies]
huggingface = ["huggingface-hub>=1.33.0"]
prefect = ["prefect>=3.8.7"]
pandas = ["pandas>=3.0.6"]
deltalake = ["deltalake>=1.6.6"]
lancedb = ["lancedb>=0.39.0"]
# Data Sources:
yfinance = ["yfinance>=1.7.0"]
cryptohftdata = ["cryptohftdata>=0.8.0"]
# s3 = ["minio>=7.2.20", "cloudpathlib[s3]>=0.24.0"]
# postgresql = ["psycopg[binary,pool]>=3.3.3"]
# fmp = ["fmp-api-client>=0.0.1"]
# databento = ["databento>=0.63.0"]
# vortex = ["vortex-data>=0.55.0"]
# kafka = ["confluent-kafka>=2.8.2"]
# massive = ["massive>=2.2.0"]  # previously "polygon"

[project.scripts]
pfeed = "pfeed.__main__:run_cli"

[project.entry-points."pfund_shell.commands"]
pfeed = "pfeed.cli:pfeed_group"

[project.urls]
homepage = "https://pfeed.pfund.ai"
repository = "https://github.com/PFund-Software-Ltd/pfeed"
documentation = "https://pfeed.pfund.ai/doc"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0 days"
exclude-newer-package = { pfund = false, pfund-kit = false }

[tool.uv.build-backend]
module-name = "pfeed"
module-root = "src"

[tool.pytest]
markers = [
    "smoke: Run the most important tests",
    "rate_limit: Run tests that can be rate-limited, e.g. calling Yahoo Finance API",
]
# strict = true
strict_markers = true
addopts = ["--no-header", "--import-mode=importlib"]
testpaths = ["tests"]
