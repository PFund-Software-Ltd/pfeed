[project]
name = "pfeed"
version = "0.0.24"
description = "Data pipeline for algo-trading, getting and storing both real-time and historical data made easy."
license = "Apache-2.0"
authors = [
    {name = "Stephen Yau", email = "softwareentrepreneer+pfeed@gmail.com"}
]
readme = "README.md"
keywords = ["algo-trading", "data pipeline", "data lake", "ducklake", "data lakehouse", "trading data", "financial data", "historical data", "live data", "streaming data"]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.13"
dependencies = [
    "pfund-blocks>=0.0.4",
    "pfund-kit>=0.1.25",
    # NOTE: for some important packages (e.g. polars, pydantic) that can benefit pfeed from using the latest version
    # even Pyodide supports them, still add sys_platform != 'emscripten', meaning that
    # let pfeed WASM use the default versions on Pyodide with NO compatibility guarantee.
    "pyarrow>=26.0.1 ; sys_platform != 'emscripten'",
    "polars>=2.1.0 ; sys_platform != 'emscripten'",
    "duckdb>=2.0.0 ; sys_platform != 'emscripten'",
    "pandera>=0.35.0",
    "narwhals>=2.28.0 ; sys_platform != 'emscripten'",
    "beautifulsoup4>=4.15.0",
    "pyzmq>=27.3.0 ; sys_platform != 'emscripten'",
]

[project.optional-dependencies]
ray = ["ray[default]>=2.60.0; python_version < '3.15'"]
huggingface = ["huggingface-hub>=2.4.0"]
prefect = ["prefect>=3.9.2"]
# kafka = ["confluent-kafka>=2.8.2"]
# Data Sources:
# NOTE: data sources are plugins, each one is a separate package named `pfeed-xxx`.
# An extra exists here only for an OFFICIALLY SUPPORTED data source, and it pins a verified version:
#   pip install "pfeed[bybit]"  # official, installs `pfeed-bybit`
#   pip install pfeed-xxx       # 3rd party, not maintained or verified by pfeed
bybit = ["pfeed-bybit>=0.0.2"]
# hyperliquid = ["pfeed-hyperliquid>=0.0.1"]
# yfinance = ["yfinance>=1.7.0"]
# edgartools = ["edgartools>=5.60.0"]
# fmp = ["fmp-api-client>=0.0.1"]
# databento = ["databento>=0.63.0"]
# massive = ["massive>=2.2.0"]  # previously "polygon"
# ---
# IOs:
lancedb = ["lancedb>=0.41.0"]
# deltalake = ["deltalake>=1.6.6"]
# iceberg = ["pyiceberg[sql-sqlite,pyiceberg-core]>=0.12.0"]
# s3 = ["minio>=7.2.20", "cloudpathlib[s3]>=0.24.0"]
# postgresql = ["psycopg[binary,pool]>=3.3.3"]
# vortex = ["vortex-data>=0.55.0"]

[dependency-groups]
dev = [
    "afterpython[marimo]>=0.5.2",
]

[project.scripts]
pfeed = "pfeed.__main__:run_cli"

[project.entry-points."pfund_shell.commands"]
pfeed = "pfeed.cli:pfeed_group"

[project.urls]
homepage = "https://pfeed.pfund.ai"
repository = "https://github.com/PFund-Software-Ltd/pfeed"
documentation = "https://pfeed.pfund.ai/doc"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0 days"
exclude-newer-package = { uv_build = false, pfund-blocks = false, pfund-kit = false }

[tool.uv.build-backend]
module-name = "pfeed"
module-root = "src"

[tool.pytest]
markers = [
    "smoke: Run the most important tests",
    "rate_limit: Run tests that can be rate-limited, e.g. calling Yahoo Finance API",
]
# strict = true
strict_markers = true
addopts = ["--no-header", "--import-mode=importlib"]
testpaths = ["tests"]
# pytest-asyncio: set explicitly, otherwise it warns on every run; "function" is its future default
asyncio_default_fixture_loop_scope = "function"
# pytest-timeout: last-resort kill for hanging tests (e.g. deadlocked Ray/ZeroMQ), dumps all thread stacks;
# "thread" because "signal" can't interrupt code blocked in C; it os._exit()s the xdist worker (no teardown)
timeout = "300"
timeout_method = "thread"

[tool.ruff]
extend = "afterpython/ruff.toml"
